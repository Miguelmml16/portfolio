<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Airport graph cover">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101012"/>
      <stop offset="1" stop-color="#12161a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <g stroke="rgba(242,85,107,0.5)" stroke-width="2">
    <line x1="160" y1="150" x2="360" y2="120"/>
    <line x1="360" y1="120" x2="560" y2="200"/>
    <line x1="160" y1="150" x2="300" y2="300"/>
    <line x1="300" y1="300" x2="560" y2="200"/>
    <line x1="560" y1="200" x2="660" y2="330"/>
