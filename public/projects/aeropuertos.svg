    <text x="560" y="204">MIA</text><text x="300" y="304">BOG</text><text x="660" y="334">JFK</text>
  </g>
  <text x="60" y="410" fill="#ffffff" font-family="monospace" font-size="30" font-weight="700">Airport Graphs</text>
  <text x="500" y="410" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="16">Java · JavaFX · Dijkstra</text>
